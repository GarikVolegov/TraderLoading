name: Candle warehouse tail

# Nightly incremental ingest from each symbol's watermark. Replaces the AWS
# EventBridge-scheduled Fargate RunTask — keeps the heavy batch OFF the Railway
# web service (which would spike its memory/usage). Free on GitHub Actions.
#
# Requires repo secret DATABASE_URL (Neon pooled connection string).
# Candle sources (Dukascopy/Binance) are public — no provider keys needed.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly (matches the former EventBridge tail)
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest mode"
        type: choice
        options: [tail, seed]
        default: tail
      symbols:
        description: "Symbols to import (comma separated)"
        type: string
        default: "XAUUSD,EURUSD,USOIL"
      years:
        description: "Years of history for seed mode"
        type: string
        default: "5"

concurrency:
  group: candle-tail
  cancel-in-progress: false

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.mode == 'seed' && 360 || 60 }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production
      INGEST_MODE: ${{ github.event.inputs.mode || 'tail' }}
      INGEST_SYMBOLS: ${{ github.event.inputs.symbols || '' }}
      INGEST_YEARS: ${{ github.event.inputs.years || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run candle ingest
        shell: bash
        run: |
          args=("$INGEST_MODE")
          if [[ -n "$INGEST_SYMBOLS" ]]; then
            args+=("--symbols=$INGEST_SYMBOLS")
          fi
          if [[ "$INGEST_MODE" == "seed" ]]; then
            args+=("--years=$INGEST_YEARS" "--resume=true")
          fi
          pnpm --filter @workspace/api-server exec tsx src/ingest.ts "${args[@]}"
