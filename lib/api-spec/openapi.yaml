openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TraderLoading API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: billing
    description: Subscription billing and entitlement operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: profile
    description: User profile operations
  - name: missions
    description: Daily missions operations
  - name: process
    description: Authenticated personal methods, evidence, sessions and advancement prerequisites.
  - name: journal
    description: Trading journal operations
  - name: ideas
    description: Ideas and goals
  - name: checklist
    description: Checklist operations
  - name: news
    description: Macro news
  - name: settings
    description: User settings
  - name: calendar
    description: Economic calendar
  - name: friends
    description: Friendship management
  - name: chat
    description: E2E encrypted chat
  - name: wiki
    description: Private user knowledge base and graph search
  - name: backtest
    description: Backtesting sessions and trades
  - name: quotes
    description: Custom trading quotes
  - name: checkins
    description: Daily session check-ins
  - name: support
    description: Support tickets and assistance threads
paths:
  /community/channels/{channelId}/context:
    get:
      operationId: getCommunityChannelContext
      tags: [chat]
      summary: Resolve a legacy checkout destination for a current community member
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: Navigation context only; channel content still checks paid access
          content:
            application/json:
              schema:
                type: object
                required: [communityId, channelId]
                properties:
                  communityId:
                    type: integer
                  channelId:
                    type: integer
        "400":
          description: Invalid identifier
        "401":
          description: Authentication required
        "404":
          description: Channel absent or unavailable to this user
  /market-decisions/{id}:
    get:
      operationId: getMarketDecision
      tags: [market-decisions]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Owned decision with original snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDecision"
        "401":
          description: Authentication required
        "404":
          description: Owned decision not found
  /market-decisions:
    get:
      operationId: getMarketDecisions
      tags: [journal]
      summary: Own immutable market decisions and their observed outcomes
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Own decisions
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MarketDecision" }
                  nextCursor: { type: [string, "null"] }
        "401": { description: Authentication required }
        "400": { description: Invalid pagination }
    post:
      operationId: createMarketDecision
      tags: [journal]
      summary: Record trade or wait against a server-issued immutable snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketDecisionRequest"
      responses:
        "201":
          description: Saved decision, safe to retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketDecision" }
        "401": { description: Authentication required }
        "400": { description: Invalid decision }
        "404": { description: Snapshot or owned journal entry unavailable }
        "409": { description: Refresh an expired context }
  /tools/macro-news:
    get:
      operationId: getToolsMacroNews
      tags: [news]
      summary: Compatibility brief over the same curated news corpus
      parameters:
        - name: pairs
          in: query
          schema: { type: string }
        - name: currencies
          in: query
          schema: { type: string }
        - name: lang
          in: query
          schema: { type: string, enum: [it, en, es, fr, de], default: it }
        - name: force
          in: query
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: At most five relevant events; no mandatory minimum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MacroNewsResponse" }
        "500": { description: News unavailable }
    post:
      operationId: queryToolsMacroNews
      tags: [news]
      summary: Legacy brief request with currency and pair filters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueryMacroNewsRequest" }
      responses:
        "200":
          description: Shared corpus in the legacy brief shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MacroNewsResponse" }
        "500": { description: News unavailable }
  /tools/market-context:
    get:
      operationId: getMarketContext
      tags: [news]
      summary: Descriptive context and independently validated four-hour outlook
      parameters:
        - name: pair
          in: query
          required: true
          schema:
            type: string
        - name: horizon
          in: query
          schema: { type: string, enum: [4h], default: 4h }
      responses:
        "200":
          description: Available contributions, provenance and coverage; score may be null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketContext"
        "400":
          description: Unsupported or absent pair
  /wiki/sources:
    get:
      operationId: listWikiSources
      tags: [wiki]
      summary: List private wiki sources
      responses:
        "200":
          description: Wiki sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiSource"

  /wiki/sources/text:
    post:
      operationId: createWikiTextSource
      tags: [wiki]
      summary: Add a text note to the private wiki
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWikiTextSourceRequest"
      responses:
        "202":
          description: Source queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiSource"

  /wiki/sources/upload:
    post:
      operationId: uploadWikiSource
      tags: [wiki]
      summary: Upload a file to the private wiki
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
              required: [file]
      responses:
        "202":
          description: Source queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiSource"

  /wiki/sources/url:
    post:
      operationId: createWikiUrlSource
      tags: [wiki]
      summary: Import a URL into the private wiki
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWikiUrlSourceRequest"
      responses:
        "202":
          description: Source queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiSource"

  /wiki/sources/{id}:
    delete:
      operationId: deleteWikiSource
      tags: [wiki]
      summary: Delete a private wiki source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
    patch:
      operationId: moveWikiSource
      tags: [wiki]
      summary: Move a wiki source into a folder (or to the root)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveWikiSourceRequest"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiSource"

  /wiki/folders:
    get:
      operationId: listWikiFolders
      tags: [wiki]
      summary: List private wiki folders
      responses:
        "200":
          description: Wiki folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiFolder"
    post:
      operationId: createWikiFolder
      tags: [wiki]
      summary: Create a wiki folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWikiFolderRequest"
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiFolder"

  /wiki/folders/{id}:
    patch:
      operationId: updateWikiFolder
      tags: [wiki]
      summary: Rename, recolor or re-parent a wiki folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWikiFolderRequest"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiFolder"
    delete:
      operationId: deleteWikiFolder
      tags: [wiki]
      summary: Delete a wiki folder (sources and child folders move to root)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Dependency check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /status:
    get:
      operationId: serviceStatus
      tags: [health]
      summary: Service status
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Dependency check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /billing/me:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get the current user's subscription status
      responses:
        "200":
          description: Billing entitlement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /billing/checkout-session:
    post:
      operationId: createBillingCheckoutSession
      tags: [billing]
      summary: Create a Stripe Embedded Checkout session for Pro
      responses:
        "200":
          description: Checkout session client secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutSession"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Stripe billing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeNotConfiguredError"

  /billing/cancel:
    post:
      operationId: cancelBillingSubscription
      tags: [billing]
      summary: Cancel Pro renewal at period end
      responses:
        "200":
          description: Updated billing entitlement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Stripe billing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeNotConfiguredError"

  /billing/resume:
    post:
      operationId: resumeBillingSubscription
      tags: [billing]
      summary: Resume a Pro subscription scheduled for cancellation
      responses:
        "200":
          description: Updated billing entitlement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Stripe billing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeNotConfiguredError"

  /billing/invoices:
    get:
      operationId: getBillingInvoices
      tags: [billing]
      summary: List current user's Stripe invoices
      responses:
        "200":
          description: Billing invoice list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingInvoices"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Stripe billing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeNotConfiguredError"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect after login.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /profile/check-name:
    get:
      operationId: checkProfileName
      tags: [profile]
      summary: Check if a profile name is available
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Name availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckNameResponse"

  /profile/avatar:
    post:
      operationId: uploadProfileAvatar
      tags: [profile]
      summary: Upload a profile avatar image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
                - image
      responses:
        "200":
          description: Uploaded avatar URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"

  /profile/avatar/generate:
    post:
      operationId: generateProfileAvatar
      tags: [profile]
      summary: Generate a unique AI avatar
      responses:
        "200":
          description: Generated avatar URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "500":
          description: Generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /mission-templates:
    get:
      operationId: getMissionTemplates
      tags: [missions]
      summary: Get user mission templates
      responses:
        "200":
          description: List of mission templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionTemplate"
    post:
      operationId: createMissionTemplate
      tags: [missions]
      summary: Create a mission template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMissionTemplateRequest"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionTemplate"

  /mission-templates/{id}:
    put:
      operationId: updateMissionTemplate
      tags: [missions]
      summary: Update a mission template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMissionTemplateRequest"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionTemplate"
    delete:
      operationId: deleteMissionTemplate
      tags: [missions]
      summary: Delete a mission template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /quotes:
    get:
      operationId: getQuotes
      tags: [quotes]
      summary: Get user quotes
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Create a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    put:
      operationId: updateQuote
      tags: [quotes]
      summary: Update a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
    delete:
      operationId: deleteQuote
      tags: [quotes]
      summary: Delete a quote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /quotes/random:
    get:
      operationId: getRandomQuote
      tags: [quotes]
      summary: Get a random quote (user or default)
      responses:
        "200":
          description: A random quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /support/tickets:
    get:
      operationId: getSupportTickets
      tags: [support]
      summary: List the current user's support tickets
      responses:
        "200":
          description: List of support tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicket"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Open a new support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketRequest"
      responses:
        "201":
          description: Created ticket thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketThread"

  /support/tickets/{id}:
    get:
      operationId: getSupportTicketThread
      tags: [support]
      summary: Get a support ticket with its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketThread"

  /support/tickets/{id}/messages:
    post:
      operationId: createSupportTicketMessage
      tags: [support]
      summary: Add a message to a support ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketMessageRequest"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketMessage"

  /checkins/today:
    get:
      operationId: getTodayCheckin
      tags: [checkins]
      summary: Get today's session check-in (null if not yet done)
      responses:
        "200":
          description: Today's check-in or null
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/Checkin"

  /checkins:
    get:
      operationId: getCheckins
      tags: [checkins]
      summary: List session check-ins (most recent first)
      responses:
        "200":
          description: List of check-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkin"
    post:
      operationId: createCheckin
      tags: [checkins]
      summary: Create a session check-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
