        actual: { type: [number, "null"] }
        previous: { type: [number, "null"] }
        consensus: { type: [number, "null"] }
        revisedPrevious: { type: [number, "null"] }
        unit: { type: [string, "null"] }
        consensusAsOf: { type: [string, "null"] }
        sourceUrl: { type: string }
    DirectionalModelState:
      type: object
      description: Statistical model status as of news fetchedAt; prices and publishable probabilities require a fresh market-context snapshot
      required: [pair, horizon, state, version, reason, samples, probabilities]
      properties:
        pair: { type: string }
        horizon: { type: string, enum: [4h] }
        state: { type: string, enum: [unvalidated, validated] }
        version: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        samples: { type: integer }
        probabilities: { type: "null" }
    QueryMacroNewsRequest:
      type: object
      properties:
        pairs: { type: string }
        currency: { type: string }
        lang: { type: string, enum: [it, en, es, fr, de] }
    MacroNewsResponse:
      type: object
      required: [articles, sentiment, summary, fetchedAt]
      properties:
        articles:
          type: array
          items: { $ref: "#/components/schemas/MacroNewsArticle" }
        sentiment: { type: string }
        sentimentIntensity: { type: string }
        summary: { type: string }
        fetchedAt: { type: string }
        citationUrls:
          type: array
          items: { type: string }
        modelStatus:
          type: array
          items: { $ref: "#/components/schemas/DirectionalModelState" }
        sourceCoverage:
          type: array
          items: { $ref: "#/components/schemas/NewsSourceCoverage" }
    NewsSourceCoverage:
      type: object
      required: [source, url, status, fetchedAt, articleCount]
      properties:
        source: { type: string }
        url: { type: string }
        status: { type: string, enum: [available, unavailable] }
        fetchedAt: { type: string }
        articleCount: { type: integer }
    MacroNewsArticle:
      type: object
      required: [title, summary, impact, currency, direction, source]
      properties:
        articleId: { type: string }
        eventId: { type: string }
        sourceDocumentId: { type: string }
        articleIds:
          type: array
          items: { type: string }
        sourceDocumentIds:
          type: array
          items: { type: string }
        firstSeenAt: { type: string }
        archiveStatus: { type: string, enum: [persisted, unavailable] }
        effects:
          type: array
          items: { $ref: "#/components/schemas/NewsPairEffect" }
        release: { $ref: "#/components/schemas/MacroRelease" }
        title: { type: string }
        summary: { type: string }
        originalTitle: { type: string }
        originalSummary: { type: string }
        impact: { type: string }
        currency: { type: string }
        direction: { type: string }
        source: { type: string }
        timestamp: { type: [string, "null"] }
        url: { type: [string, "null"] }
        resolvedUrl: { type: [string, "null"] }
        sourceUrl: { type: [string, "null"] }
        sourceType: { type: string, enum: [official, publisher] }
        contentBasis: { type: string, enum: [full_text, snippet, headline] }
        analysisMethod: { type: string, enum: [llm, heuristic, none] }
        verified: { type: boolean }
        category: { type: string }
        imageUrl: { type: [string, "null"] }
        imageKeywords:
          type: array
          items: { type: string }
        sources:
          type: array
          items: { type: string }
        citationUrls:
          type: array
          items: { type: string }
        affectedPairs:
          type: array
          items: { type: string }
        primaryAssets:
          type: array
          items: { type: string }
        deepDive: { $ref: "#/components/schemas/NewsDeepDive" }
    DirectionalProbabilities:
      type: object
      required: [up, flat, down]
      properties:
        up: { type: number, minimum: 0, maximum: 1 }
        flat: { type: number, minimum: 0, maximum: 1 }
        down: { type: number, minimum: 0, maximum: 1 }
    DirectionalValidation:
      type: object
      required: [passed, samples, classCounts, calibration, pValue, brier, startedAt, endedAt]
      properties:
        passed: { type: boolean }
        samples: { type: integer }
        classCounts:
          type: object
          additionalProperties: { type: integer }
        calibration:
          type: object
          additionalProperties: { type: [number, "null"] }
        pValue: { type: number }
        brier: { type: [number, "null"] }
        startedAt: { type: [string, "null"] }
        endedAt: { type: [string, "null"] }
    DirectionalOutlook:
      type: object
      required:
        [
          pair,
          horizon,
          status,
          reason,
          cutoffAt,
          issuedAt,
          targetEnd,
          referencePrice,
          referenceObservedAt,
          neutralBand,
          probabilities,
          modelVersion,
          validation,
          sources,
        ]
      properties:
        pair: { type: string }
        horizon: { type: string, enum: [4h] }
        status: { type: string, enum: [available, unvalidated, insufficient, unsupported, stale] }
        reason: { type: [string, "null"] }
        cutoffAt: { type: string }
        issuedAt: { type: string }
        targetEnd: { type: string }
        referencePrice: { type: [number, "null"] }
        referenceObservedAt: { type: [string, "null"] }
        modelVersion: { type: [string, "null"] }
        probabilities:
          oneOf:
            - $ref: "#/components/schemas/DirectionalProbabilities"
            - type: "null"
        neutralBand:
          oneOf:
            - type: object
              required: [lower, upper]
              properties:
                lower: { type: number }
                upper: { type: number }
            - type: "null"
        validation:
          oneOf:
            - $ref: "#/components/schemas/DirectionalValidation"
            - type: "null"
        sources:
          type: array
          items: { type: string }
    MarketDecision:
      type: object
      required: [id, snapshotId, choice, note, journalEntryId, createdAt, snapshot, outcome]
      properties:
        id: { type: string, format: uuid }
        snapshotId: { type: string }
        choice: { type: string, enum: [trade, wait] }
        note: { type: string }
        journalEntryId: { type: [integer, "null"] }
        createdAt: { type: string }
        snapshot: { $ref: "#/components/schemas/MarketContext" }
        outcome:
          oneOf:
            - type: object
              required: [outcome, returnLog, finalPrice, observedAt]
              properties:
                outcome: { type: string, enum: [up, flat, down] }
                returnLog: { type: number }
                finalPrice: { type: number }
                observedAt: { type: string }
            - type: "null"

    CreateMarketDecisionRequest:
      type: object
      required: [snapshotId, choice]
      properties:
        snapshotId: { type: string, pattern: "^[a-f0-9]{64}$" }
        choice: { type: string, enum: [trade, wait] }
        note: { type: string, maxLength: 4000 }
        journalEntryId: { type: integer, minimum: 1 }
