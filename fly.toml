# Fly.io deployment configuration for LIMEN Protocol
app = "limen-protocol"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  BASE_PATH = "/"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/readyz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  cpus = 2
