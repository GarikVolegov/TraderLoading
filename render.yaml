# Render.com Infrastructure Blueprint for LIMEN Protocol
# Post-Railway Migration Blueprint
services:
  - type: web
    name: limen-protocol
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: frankfurt
    healthCheckPath: /api/readyz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: BASE_PATH
        value: /
      - key: DATABASE_URL
        fromDatabase:
          name: limen-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: limen-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BROKER_VAULT_KEY
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false

  - type: redis
    name: limen-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: limen-postgres
    plan: standard
    region: frankfurt
    postgresMajorVersion: 16
    databaseName: limen_production
    user: limen_admin
