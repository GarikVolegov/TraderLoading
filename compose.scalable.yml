services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.oracle}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/scalable/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      gateway:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.oracle
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.oracle}
    environment:
      NODE_ENV: production
      PORT: 3001
      SERVICE_ROLE: api
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EXPECTED_REPLICAS: ${EXPECTED_REPLICAS:-2}
      FRONTEND_DIST_DIR: /app/artifacts/trader-dashboard/dist/public
    volumes:
      - trader_uploads:/app/artifacts/api-server/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.oracle
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.oracle}
    environment:
      NODE_ENV: production
      PORT: 3002
      SERVICE_ROLE: gateway
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EXPECTED_REPLICAS: ${EXPECTED_REPLICAS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.oracle
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.oracle}
    environment:
      NODE_ENV: production
      PORT: 3003
      SERVICE_ROLE: worker
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_REPLICA_URL: ${DATABASE_READ_REPLICA_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3003/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file:
      - ${DEPLOY_ENV_FILE:-.env.oracle}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traderloading}
      POSTGRES_USER: ${POSTGRES_USER:-traderloading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - trader_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traderloading} -d ${POSTGRES_DB:-traderloading}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - trader_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  trader_uploads:
  trader_postgres:
  trader_redis:
