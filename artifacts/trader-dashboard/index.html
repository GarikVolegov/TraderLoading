    <!-- Fail-safe Pre-React Recovery Handler: Previene definitivamente la schermata nera in caso di chunk 404 durante gli aggiornamenti PWA -->
    <script>
      (function() {
        var hasTriggeredRecovery = false;
        function triggerEmergencyRecovery(reason) {
          if (hasTriggeredRecovery) return;
          hasTriggeredRecovery = true;
          console.warn("[AUREUS Fail-Safe] Errore di caricamento chunk/modulo:", reason);
          var splash = document.getElementById("app-splash");
          if (splash) {
            splash.removeAttribute("aria-hidden");
            splash.style.animation = "none";
            splash.innerHTML =
              '<div style="max-width:340px;margin:0 auto;text-align:center;padding:24px;color:#F4F4F6;font-family:\'Space Grotesk\',system-ui,sans-serif;">' +
              '<div style="width:56px;height:56px;margin:0 auto 16px;border-radius:14px;border:1px solid rgba(197,160,89,0.4);background:#11131c;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(197,160,89,0.2);">' +

              '<button type="button" onclick="if(\'caches\' in window){caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));}).then(function(){location.reload(true);});}else{location.reload(true);}" style="cursor:pointer;background:#C5A059;color:#07080B;border:none;border-radius:8px;padding:10px 22px;font-weight:700;font-size:11px;font-family:monospace;letter-spacing:0.12em;text-transform:uppercase;box-shadow:0 4px 16px rgba(197,160,89,0.3);">' +
              'Sincronizza Protocollo' +
              '</button>' +
              '</div>';
          }
        }

        window.addEventListener("error", function(e) {
          if (e && e.target && e.target.tagName === "SCRIPT") {
            triggerEmergencyRecovery("Script tag load failed: " + (e.target.src || "module"));
          }
        }, true);
      })();
    </script>
