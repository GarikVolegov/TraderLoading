<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2400" width="1200" height="2400" fill="none">
  <!-- ARCHITETTURA MONUMENTALE ROMANA // COLONNA ISTORIATA -->
  <!-- Pure Classical Roman Pillar & Continuous Narrative Frieze -->
  <!-- Discreet, quiet luxury: zero aggressive branding, museum-grade classical craftsmanship -->
  <!-- Threads: Antique Gold (#C5A059) & Deep Obsidian Black (#111111) -->

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 1. APICE & CORONA TRIONFALE (Apex & Celestial Keystone)             -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="apex-statua" transform="translate(600, 190)">
    <!-- Piccolo braciere/globo trionfale romano -->
    <ellipse cx="0" cy="50" rx="42" ry="14" fill="#C5A059" stroke="#111111" stroke-width="4" />
    <path d="M -35 50 C -35 20 -15 0 0 -15 C 15 0 35 20 35 50 Z" fill="#111111" stroke="#C5A059" stroke-width="4" />
    
    <!-- Corona d'alloro apicale classica -->
    <path d="M -48 30 C -60 10 -55 -15 -35 -30" stroke="#C5A059" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 48 30 C 60 10 55 -15 35 -30" stroke="#C5A059" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="-42" cy="-5" r="4" fill="#C5A059" />
    <circle cx="42" cy="-5" r="4" fill="#C5A059" />

    <!-- Il Rombo Sacro (Keystone) discreto al vertice -->
    <polygon points="0,-65 26,-30 0,5 -26,-30" fill="#C5A059" stroke="#111111" stroke-width="4" stroke-linejoin="round" />
    <circle cx="0" cy="-30" r="7" fill="#111111" />
    <circle cx="0" cy="-30" r="2.5" fill="#C5A059" />
    <!-- Sottile raggio zenitale -->
    <line x1="0" y1="-85" x2="0" y2="-65" stroke="#C5A059" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 2. IL CAPITELLO CORINZIO CLASSICO (Corinthian Capital)              -->
  <!-- Scolpito con volute, foglie d'acanto e abaco modanato               -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="capitello-corinzio" transform="translate(600, 310)">
    <!-- Abaco modanato superiore con lati concavi romani -->
    <path d="M -160 0 Q 0 -10 160 0 L 170 20 Q 0 10 -170 20 Z" fill="#111111" stroke="#C5A059" stroke-width="5" />
    <!-- Fiorellino d'abaco centrale (Rosetta romana) -->
    <circle cx="0" cy="8" r="8" fill="#C5A059" stroke="#111111" stroke-width="2" />
    <circle cx="0" cy="8" r="3" fill="#111111" />

    <!-- Cornice a ovoli e dardi (Egg & Dart) sotto l'abaco -->
    <rect x="-148" y="20" width="296" height="14" fill="#C5A059" rx="2" />
    <g fill="#111111">
      <ellipse cx="-120" cy="27" rx="5" ry="4" />
      <ellipse cx="-80" cy="27" rx="5" ry="4" />
      <ellipse cx="-40" cy="27" rx="5" ry="4" />
      <ellipse cx="0" cy="27" rx="5" ry="4" />
      <ellipse cx="40" cy="27" rx="5" ry="4" />
      <ellipse cx="80" cy="27" rx="5" ry="4" />
      <ellipse cx="120" cy="27" rx="5" ry="4" />
    </g>

    <!-- Volute angolari del capitello -->
    <g stroke="#C5A059" stroke-width="5" fill="#111111">
      <!-- Voluta sinistra -->
      <path d="M -140 34 C -165 45 -160 75 -135 70 C -120 65 -125 50 -135 52" />
      <!-- Voluta destra -->
      <path d="M 140 34 C 165 45 160 75 135 70 C 120 65 125 50 135 52" />
      <!-- Volutine interne / elici -->
      <path d="M -40 34 C -20 45 -25 65 -40 60" />
      <path d="M 40 34 C 20 45 25 65 40 60" />
    </g>

    <!-- Calato (corpo centrale del capitello) con Foglie d'Acanto -->
    <path d="M -135 34 L -115 130 L 115 130 L 135 34 Z" fill="#111111" stroke="#C5A059" stroke-width="4" />
    
    <!-- Ordine 1 di Foglie d'Acanto (Scanalature organiche) -->
    <g fill="#C5A059" stroke="#111111" stroke-width="2">
      <!-- Foglia centrale -->
      <path d="M 0 55 C -14 75 -12 115 0 130 C 12 115 14 75 0 55 Z" />
      <!-- Foglia sinistra 1 -->
      <path d="M -45 65 C -60 85 -55 115 -40 130 C -32 115 -35 85 -45 65 Z" />
      <!-- Foglia destra 1 -->
      <path d="M 45 65 C 60 85 55 115 40 130 C 32 115 35 85 45 65 Z" />
      <!-- Foglie laterali angolari -->
      <path d="M -90 75 C -110 95 -105 118 -85 130 C -80 115 -82 90 -90 75 Z" />
      <path d="M 90 75 C 110 95 105 118 85 130 C 80 115 82 90 90 75 Z" />
    </g>

    <!-- Astragalo (Tondino con modanatura a perline alla base del capitello) -->
    <rect x="-120" y="130" width="240" height="14" fill="#C5A059" rx="3" />
    <line x1="-115" y1="137" x2="115" y2="137" stroke="#111111" stroke-width="3" stroke-dasharray="6 6" />
    <rect x="-110" y="144" width="220" height="8" fill="#111111" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 3. IL FUSTO DELLA COLONNA TRAIANA (Fluted Shaft & Spiral Frieze)   -->
  <!-- Slanciato, solenne, con bassorilievo continuo a spirale             -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="fusto-istoriato" transform="translate(600, 460)">
    <!-- Corpo del fusto (Entasi romana con leggera rastrematura) -->
    <path d="M -110 0 L -125 1380 L 125 1380 L 110 0 Z" fill="#111111" stroke="#C5A059" stroke-width="6" />

    <!-- Scanalature romane cannellate verticali nel fondo del marmo -->
    <g stroke="#C5A059" stroke-width="2.5" opacity="0.35">
      <line x1="-95" y1="5" x2="-108" y2="1375" />
      <line x1="-65" y1="5" x2="-75" y2="1375" />
      <line x1="-35" y1="5" x2="-40" y2="1375" />
      <line x1="0" y1="5" x2="0" y2="1375" />
      <line x1="35" y1="5" x2="40" y2="1375" />
      <line x1="65" y1="5" x2="75" y2="1375" />
      <line x1="95" y1="5" x2="108" y2="1375" />
    </g>

    <!-- ─── SPIRALE 1 (y: 20 -> 240): SCENA V · IL TRIONFO DELLA SOGLIA ─── -->
    <g id="spirale-5">
      <!-- Nastro marmoreo a rilievo dorato -->
      <path d="M -112 180 Q 0 140 114 180 L 115 235 Q 0 195 -113 235 Z" fill="#C5A059" stroke="#111111" stroke-width="3" />
      
      <!-- Bassorilievo figurativo romano: La Vittoria Alata che scrive sullo scudo -->
      <g transform="translate(0, 85)">
        <!-- Corona d'alloro romana tenuta alta -->
        <circle cx="0" cy="10" r="28" stroke="#C5A059" stroke-width="5" fill="none" />
        <circle cx="0" cy="10" r="14" fill="#C5A059" />
        <polygon points="0,2 7,10 0,18 -7,10" fill="#111111" />
        <!-- Ali della Vittoria spiegate -->
        <path d="M -35 15 C -65 -5 -60 -30 -35 -20 C -45 0 -40 10 -30 20" stroke="#C5A059" stroke-width="4" fill="#111111" />
        <path d="M 35 15 C 65 -5 60 -30 35 -20 C 45 0 40 10 30 20" stroke="#C5A059" stroke-width="4" fill="#111111" />
      </g>
    </g>

    <!-- ─── SPIRALE 2 (y: 260 -> 520): SCENA IV · L'ARCO TRIONFALE & LE OPERE ─── -->
    <g id="spirale-4">
      <path d="M -115 460 Q 0 415 117 460 L 118 515 Q 0 470 -116 515 Z" fill="#C5A059" stroke="#111111" stroke-width="3" />
      
      <!-- Bassorilievo: Arco Trionfale Romano con quadriga / insegna -->
      <g transform="translate(0, 345)">
        <!-- Portale ad arco romano -->
        <rect x="-42" y="-30" width="84" height="65" fill="#111111" stroke="#C5A059" stroke-width="4" />
        <path d="M -24 35 V 0 A 24 24 0 0 1 24 0 V 35" fill="#C5A059" stroke="#111111" stroke-width="3" />
        <!-- Attico dell'arco con timpano -->
        <polygon points="0,-48 46,-30 -46,-30" fill="#C5A059" stroke="#111111" stroke-width="2" />
        <circle cx="0" cy="-38" r="4" fill="#111111" />
        <!-- Colonne dell'arco -->
        <line x1="-34" y1="-30" x2="-34" y2="35" stroke="#C5A059" stroke-width="3" />
        <line x1="34" y1="-30" x2="34" y2="35" stroke="#C5A059" stroke-width="3" />
      </g>
    </g>

    <!-- ─── SPIRALE 3 (y: 540 -> 800): SCENA III · LE AQUILA E GLI STENDARDI ─── -->
    <g id="spirale-3">
      <path d="M -118 740 Q 0 690 120 740 L 121 795 Q 0 745 -119 795 Z" fill="#C5A059" stroke="#111111" stroke-width="3" />
      
      <!-- Bassorilievo: L'Aquila delle Legioni (Aquila Romana) & I Vessilli -->
      <g transform="translate(0, 620)">
        <!-- Aquila imperiale spiegata sopra il fulmine -->
        <path d="M 0 -35 L 8 -22 L 20 -28 L 12 -12 L 32 -10 L 18 2 L 28 18 L 8 10 L 0 25 L -8 10 L -28 18 L -18 2 L -32 -10 L -12 -12 L -20 -28 L -8 -22 Z" fill="#C5A059" stroke="#111111" stroke-width="2" />
        <circle cx="0" cy="-5" r="7" fill="#111111" />
        <!-- Stendardo (Signum / Vexillum) -->
        <line x1="-40" y1="-30" x2="-40" y2="40" stroke="#C5A059" stroke-width="4" />
        <rect x="-52" y="-25" width="24" height="20" fill="#111111" stroke="#C5A059" stroke-width="2" />
        <circle cx="-40" cy="-15" r="4" fill="#C5A059" />

        <line x1="40" y1="-30" x2="40" y2="40" stroke="#C5A059" stroke-width="4" />
        <rect x="28" y="-25" width="24" height="20" fill="#111111" stroke="#C5A059" stroke-width="2" />
        <circle cx="40" cy="-15" r="4" fill="#C5A059" />
      </g>
    </g>

    <!-- ─── SPIRALE 4 (y: 820 -> 1080): SCENA II · LA COSTRUZIONE & LA DISCIPLINA ─── -->
    <g id="spirale-2">
      <path d="M -121 1020 Q 0 965 122 1020 L 123 1075 Q 0 1020 -122 1075 Z" fill="#C5A059" stroke="#111111" stroke-width="3" />
      
      <!-- Bassorilievo: Costruzione del Castrum Romano (Mura isodome, filo a piombo, squadratura) -->
      <g transform="translate(0, 905)">
        <!-- Mura ad opus quadratum (blocchi di pietra regolari) -->
        <rect x="-48" y="-15" width="96" height="45" fill="#111111" stroke="#C5A059" stroke-width="3" />
        <line x1="-48" y1="0" x2="48" y2="0" stroke="#C5A059" stroke-width="2" />
        <line x1="-48" y1="15" x2="48" y2="15" stroke="#C5A059" stroke-width="2" />
        <line x1="-48" y1="30" x2="48" y2="30" stroke="#C5A059" stroke-width="2" />
        <!-- Giunti di pietra sfalsati -->
        <line x1="-24" y1="-15" x2="-24" y2="0" stroke="#C5A059" stroke-width="2" />
        <line x1="16" y1="-15" x2="16" y2="0" stroke="#C5A059" stroke-width="2" />
        <line x1="0" y1="0" x2="0" y2="15" stroke="#C5A059" stroke-width="2" />
        <line x1="-30" y1="15" x2="-30" y2="30" stroke="#C5A059" stroke-width="2" />
        <line x1="22" y1="15" x2="22" y2="30" stroke="#C5A059" stroke-width="2" />
        
        <!-- Lo strumento di misura romano: Archipendolo / Livella a filo a piombo -->
        <polygon points="0,-45 28,-15 -28,-15" fill="none" stroke="#C5A059" stroke-width="3" />
        <line x1="0" y1="-45" x2="0" y2="-12" stroke="#C5A059" stroke-width="3" />
        <circle cx="0" cy="-12" r="4" fill="#C5A059" />
      </g>
    </g>

    <!-- ─── SPIRALE 5 (y: 1100 -> 1360): SCENA I · IL PONTE DI BARCHE & IL VARCO ─── -->
    <g id="spirale-1">
      <path d="M -124 1300 Q 0 1240 125 1300 L 125 1355 Q 0 1295 -124 1355 Z" fill="#C5A059" stroke="#111111" stroke-width="3" />
      
      <!-- Bassorilievo: Il Ponte di Barche sul Danubio che entra nella prima porta fortificata -->
      <g transform="translate(0, 1185)">
        <!-- Porta fortificata d'ingresso (La Soglia d'Inizio) -->
        <path d="M -22 35 V 5 A 22 22 0 0 1 22 5 V 35" fill="none" stroke="#C5A059" stroke-width="4" />
        <polygon points="0,-12 30,5 -30,5" fill="#C5A059" stroke="#111111" stroke-width="2" />
        
        <!-- Onde del fiume Danuvius alla base -->
        <path d="M -60 30 Q -45 22 -30 30 Q -15 38 0 30 Q 15 22 30 30 Q 45 38 60 30" stroke="#C5A059" stroke-width="3" fill="none" />
        <path d="M -60 40 Q -45 32 -30 40 Q -15 48 0 40 Q 15 32 30 40 Q 45 48 60 40" stroke="#C5A059" stroke-width="2.5" fill="none" />

        <!-- Galea / Barca romana di passaggio -->
        <path d="M -35 20 C -25 32 25 32 35 20 Z" fill="#111111" stroke="#C5A059" stroke-width="2.5" />
        <line x1="0" y1="5" x2="0" y2="22" stroke="#C5A059" stroke-width="3" />
      </g>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 4. BASE ATTICA DELLA COLONNA (Attic Base: Torus, Scotia, Torus)     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="base-attica" transform="translate(600, 1840)">
    <!-- Piccolo collarino (Cincture) -->
    <rect x="-132" y="0" width="264" height="12" fill="#111111" stroke="#C5A059" stroke-width="3" />
    
    <!-- Toro superiore (Upper Torus arrotondato dorato) -->
    <rect x="-150" y="12" width="300" height="22" fill="#C5A059" rx="10" stroke="#111111" stroke-width="4" />
    <line x1="-138" y1="23" x2="138" y2="23" stroke="#111111" stroke-width="2" />

    <!-- Scozia (Trochilus rientrante nero) -->
    <rect x="-140" y="34" width="280" height="16" fill="#111111" />

    <!-- Toro inferiore (Lower Torus grande) -->
    <rect x="-170" y="50" width="340" height="28" fill="#C5A059" rx="12" stroke="#111111" stroke-width="5" />
    <line x1="-155" y1="64" x2="155" y2="64" stroke="#111111" stroke-width="3" />

    <!-- Plinto ottagonale / quadro di raccordo -->
    <rect x="-185" y="78" width="370" height="22" fill="#111111" stroke="#C5A059" stroke-width="4" rx="3" />
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- 5. IL PIEDISTALLO MONUMENTALE SCOLPITO (Classical Roman Pedestal)  -->
  <!-- Con festoni d'alloro romani, modanatura e dedica lapidaria sobria   -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <g id="piedistallo" transform="translate(600, 1940)">
    <!-- Cimasa modanata superiore del piedistallo -->
    <rect x="-215" y="0" width="430" height="24" fill="#C5A059" rx="3" />
    <rect x="-235" y="24" width="470" height="18" fill="#111111" stroke="#C5A059" stroke-width="4" rx="2" />

    <!-- Il Grande Dado Centrale (Dado del piedistallo) -->
    <rect x="-225" y="42" width="450" height="260" fill="#111111" stroke="#C5A059" stroke-width="7" rx="3" />

    <!-- Cornice a rilievo incassata -->
    <rect x="-205" y="60" width="410" height="224" fill="none" stroke="#C5A059" stroke-width="3" />

    <!-- FESTONE D'ALLORO ROMANO (Garland suspended between rosettes) -->
    <!-- Rosetta sinistra -->
    <circle cx="-160" cy="95" r="10" fill="#C5A059" stroke="#111111" stroke-width="2" />
    <circle cx="-160" cy="95" r="4" fill="#111111" />
    <!-- Rosetta destra -->
    <circle cx="160" cy="95" r="10" fill="#C5A059" stroke="#111111" stroke-width="2" />
    <circle cx="160" cy="95" r="4" fill="#111111" />

    <!-- Festone d'alloro curvato a festone -->
    <path d="M -160 95 Q 0 160 160 95" stroke="#C5A059" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M -160 95 Q 0 174 160 95" stroke="#C5A059" stroke-width="3" fill="none" />
    <!-- Nastri svolazzanti laterali (Lemnisci romani) -->
    <path d="M -160 105 C -175 125 -165 145 -180 160" stroke="#C5A059" stroke-width="3" fill="none" />
    <path d="M 160 105 C 175 125 165 145 180 160" stroke="#C5A059" stroke-width="3" fill="none" />

    <!-- TABULA EPIGRAPHICA: Sola iscrizione classica sobria, SENZA gridare il brand -->
    <text x="0" y="165" text-anchor="middle" font-family="'Times New Roman', 'Baskerville', serif" font-size="20" font-weight="bold" fill="#C5A059" letter-spacing="6">COLUMNA · CAELATA</text>
    
    <text x="0" y="195" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#F3F4F6" letter-spacing="4">NULLA DIES SINE LINEA</text>
    
    <text x="0" y="222" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#9CA3AF" letter-spacing="3">ITER DISCIPLINAE ET OPERIS</text>

    <!-- Linea lapidaria di chiusura con rombo discreto -->
    <line x1="-120" y1="245" x2="120" y2="245" stroke="#C5A059" stroke-width="2" />
    <polygon points="0,240 5,245 0,250 -5,245" fill="#C5A059" />

    <!-- Anno in numeri romani -->
    <text x="0" y="268" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#C5A059" letter-spacing="4">M · M · X · X · I · V</text>

    <!-- Zoccolo inferiore del basamento -->
    <rect x="-245" y="302" width="490" height="22" fill="#C5A059" rx="2" />
    <rect x="-265" y="324" width="530" height="24" fill="#111111" stroke="#C5A059" stroke-width="4" rx="2" />
  </g>
</svg>
