<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1600" width="600" height="1600">
  <defs>
    <!-- Gradiente Oro Metallico Ricamo Madeira -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDAA2" />
      <stop offset="35%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#9E7833" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6826" />
    </linearGradient>

    <!-- Ombra 3D Filo Ricamato -->
    <filter id="stitchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g id="pant-ordo-geometrico" filter="url(#stitchShadow)">
    <!-- 1. ASSE PRINCIPALE: IL CARDO MAXIMUS (Linea Guida Verticale) -->
    <!-- Asse centrale principale -->
    <line x1="300" y1="120" x2="300" y2="1480" stroke="url(#goldSheen)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Linee parallele sottili di allineamento (Groma romana) -->
    <line x1="284" y1="200" x2="284" y2="1400" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="8 12" stroke-opacity="0.5" />
    <line x1="316" y1="200" x2="316" y2="1400" stroke="#C5A059" stroke-width="1.2" stroke-dasharray="8 12" stroke-opacity="0.5" />

    <!-- 2. TERMINAZIONI SACRE DELL'ASSE: NORD & SUD (Punte a Lancia / Chiave di Volta) -->
    <!-- Apice Superiore (Cardo Nord) -->
    <polygon points="300,70 318,120 300,108 282,120" fill="url(#goldLight)" stroke="#C5A059" stroke-width="2" />
    <circle cx="300" cy="50" r="5" fill="#EEDAA2" />
    <circle cx="300" cy="140" r="4" fill="#C5A059" />

    <!-- Apice Inferiore (Cardo Sud) -->
    <polygon points="300,1530 318,1480 300,1492 282,1480" fill="url(#goldLight)" stroke="#C5A059" stroke-width="2" />
    <circle cx="300" cy="1550" r="5" fill="#EEDAA2" />
    <circle cx="300" cy="1460" r="4" fill="#C5A059" />

    <!-- 3. INTERSEZIONE PRINCIPALE: IL DECUMANUS MAXIMUS (Quadrante Aureo a y=580) -->
    <!-- Asse Orizzontale Decumano -->
    <line x1="100" y1="580" x2="500" y2="580" stroke="url(#goldSheen)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="140" y1="568" x2="460" y2="568" stroke="#C5A059" stroke-width="1" stroke-dasharray="6 8" stroke-opacity="0.6" />
    <line x1="140" y1="592" x2="460" y2="592" stroke="#C5A059" stroke-width="1" stroke-dasharray="6 8" stroke-opacity="0.6" />

    <!-- Terminali Decumano (Est / Ovest) -->
    <polygon points="80,580 105,570 100,580 105,590" fill="url(#goldLight)" />
    <polygon points="520,580 495,570 500,580 495,590" fill="url(#goldLight)" />

    <!-- Nodo Centrale: Il Quadrante della Soglia (Limen Nexus) -->
    <!-- Cerchi concentrici del tracciamento -->
    <circle cx="300" cy="580" r="72" fill="none" stroke="url(#goldSheen)" stroke-width="2.5" />
    <circle cx="300" cy="580" r="64" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.7" />
    <circle cx="300" cy="580" r="28" fill="#141418" stroke="url(#goldLight)" stroke-width="3" />
    
    <!-- Rombo interno centrale -->
    <polygon points="300,562 318,580 300,598 282,580" fill="url(#goldLight)" />
    <circle cx="300" cy="580" r="4" fill="#141418" />

    <!-- Punti Cardinali Romani sul Nexus -->
    <circle cx="300" cy="508" r="3.5" fill="#EEDAA2" />
    <circle cx="300" cy="652" r="3.5" fill="#EEDAA2" />
    <circle cx="228" cy="580" r="3.5" fill="#EEDAA2" />
    <circle cx="372" cy="580" r="3.5" fill="#EEDAA2" />

    <!-- 4. GRADUAZIONI ARCHITETTONICHE MILLIMETRICHE (Regula Augustea) -->
    <!-- Registri Superiori (Ascesa dal Grado I al Grado V) -->
    <!-- Grado V (Top) -->
    <line x1="250" y1="260" x2="350" y2="260" stroke="url(#goldSheen)" stroke-width="2" />
    <line x1="270" y1="245" x2="330" y2="245" stroke="#C5A059" stroke-width="1.2" />
    <line x1="280" y1="230" x2="320" y2="230" stroke="#C5A059" stroke-width="1.2" />
    <text x="365" y="264" fill="#C5A059" font-family="'Cinzel', 'Times New Roman', serif" font-size="14" font-weight="bold" letter-spacing="2">V · APEX</text>

    <!-- Grado IV -->
    <line x1="260" y1="360" x2="340" y2="360" stroke="url(#goldSheen)" stroke-width="2" />
    <line x1="275" y1="380" x2="325" y2="380" stroke="#C5A059" stroke-width="1" />
    <line x1="275" y1="400" x2="325" y2="400" stroke="#C5A059" stroke-width="1" />
    <line x1="270" y1="420" x2="330" y2="420" stroke="#C5A059" stroke-width="1.2" />
    <text x="355" y="364" fill="#C5A059" font-family="'Cinzel', 'Times New Roman', serif" font-size="13" font-weight="bold" letter-spacing="2">IV · ORDO</text>

    <!-- Grado III -->
    <line x1="255" y1="480" x2="345" y2="480" stroke="url(#goldSheen)" stroke-width="2" />
    <text x="360" y="484" fill="#C5A059" font-family="'Cinzel', 'Times New Roman', serif" font-size="13" font-weight="bold" letter-spacing="2">III · CONSTANTIA</text>

    <!-- Sezione Inferiore al Decumano -->
    <!-- Grado II -->
    <line x1="255" y1="720" x2="345" y2="720" stroke="url(#goldSheen)" stroke-width="2" />
    <line x1="275" y1="740" x2="325" y2="740" stroke="#C5A059" stroke-width="1" />
    <line x1="275" y1="760" x2="325" y2="760" stroke="#C5A059" stroke-width="1" />
    <line x1="270" y1="780" x2="330" y2="780" stroke="#C5A059" stroke-width="1.2" />
    <text x="360" y="724" fill="#C5A059" font-family="'Cinzel', 'Times New Roman', serif" font-size="13" font-weight="bold" letter-spacing="2">II · REGULA</text>

    <!-- Grado I (Base) -->
    <line x1="245" y1="880" x2="355" y2="880" stroke="url(#goldSheen)" stroke-width="2" />
    <line x1="265" y1="910" x2="335" y2="910" stroke="#C5A059" stroke-width="1.2" />
    <line x1="275" y1="940" x2="325" y2="940" stroke="#C5A059" stroke-width="1" />
    <line x1="275" y1="970" x2="325" y2="970" stroke="#C5A059" stroke-width="1" />
    <text x="370" y="884" fill="#C5A059" font-family="'Cinzel', 'Times New Roman', serif" font-size="13" font-weight="bold" letter-spacing="2">I · LIMEN</text>

    <!-- 5. TACCHE DI MISURA AUREA LUNGO IL CARDO (Micro-hatching) -->
    <!-- Scala millimetrica da agrimensore romano -->
    <g stroke="#C5A059" stroke-width="1.5">
      <line x1="290" y1="1040" x2="310" y2="1040" />
      <line x1="294" y1="1060" x2="306" y2="1060" />
      <line x1="294" y1="1080" x2="306" y2="1080" />
      <line x1="290" y1="1100" x2="310" y2="1100" />
      <line x1="294" y1="1120" x2="306" y2="1120" />
      <line x1="294" y1="1140" x2="306" y2="1140" />
      <line x1="285" y1="1160" x2="315" y2="1160" stroke-width="2" />
      <line x1="294" y1="1180" x2="306" y2="1180" />
      <line x1="294" y1="1200" x2="306" y2="1200" />
      <line x1="290" y1="1220" x2="310" y2="1220" />
      <line x1="294" y1="1240" x2="306" y2="1240" />
      <line x1="294" y1="1260" x2="306" y2="1260" />
      <line x1="285" y1="1280" x2="315" y2="1280" stroke-width="2" />
      <line x1="294" y1="1300" x2="306" y2="1300" />
      <line x1="294" y1="1320" x2="306" y2="1320" />
      <line x1="290" y1="1340" x2="310" y2="1340" />
      <line x1="294" y1="1360" x2="306" y2="1360" />
      <line x1="290" y1="1380" x2="310" y2="1380" />
    </g>

    <!-- 6. EPIGRAFE VERTICALE SOTTILE D'ORDINE (Scrittura Lapidaria Laterale) -->
    <!-- Scritta verticale lungo il lato sinistro del Cardo: CARDO MAXIMUS -->
    <g transform="translate(235, 1260) rotate(-90)">
      <text x="0" y="0" fill="#C5A059" font-family="'Cinzel', 'Times New Roman', serif" font-size="12" font-weight="600" letter-spacing="6" opacity="0.85">CARDO · MAXIMUS</text>
    </g>

    <!-- Scritta verticale lungo il lato destro del Cardo: DECUMANUS -->
    <g transform="translate(335, 1020) rotate(90)">
      <text x="0" y="0" fill="#C5A059" font-family="'Cinzel', 'Times New Roman', serif" font-size="12" font-weight="600" letter-spacing="6" opacity="0.85">CANON · GEOMETRICUS</text>
    </g>

    <!-- Micro Sigillo Circolare Inferiore (Sigillum Disciplinae) -->
    <g transform="translate(300, 1420)">
      <circle cx="0" cy="0" r="22" fill="#141418" stroke="url(#goldSheen)" stroke-width="2" />
      <circle cx="0" cy="0" r="18" fill="none" stroke="#C5A059" stroke-width="0.8" stroke-dasharray="3 3" />
      <polygon points="0,-10 8,0 0,10 -8,0" fill="url(#goldLight)" />
      <circle cx="0" cy="0" r="2.5" fill="#141418" />
    </g>
  </g>
</svg>